            VITE_API_PROXY_TARGET=${{ env.VITE_API_PROXY_PORTAL_TARGET }}
            VITE_COMM_API_LOAD_PORTAL_FORM_ENDPOINT_URL=${{ env.VITE_COMM_API_LOAD_PORTAL_FORM_ENDPOINT_URL }}
            VITE_IS_PORTAL_INTEGRATED=true


    outputs:
      image_tag: ${{ env.REGISTRY }}/${{ env.PORTAL_IMAGE_NAME }}:${{ github.ref_name }}

  deploy_to_portal:
    runs-on: ubuntu-latest
    needs: build_and_push_portal

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install oc CLI
        uses: redhat-actions/oc-installer@v1

      - name: Authenticate with OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          namespace: ${{ github.ref == 'refs/heads/main' && secrets.OPENSHIFT_PROD_PORTAL_NAMESPACE || (github.ref == 'refs/heads/dev' && secrets.OPENSHIFT_DEV_PORTAL_NAMESPACE) || secrets.OPENSHIFT_TEST_PORTAL_NAMESPACE }}
          openshift_token: ${{ github.ref == 'refs/heads/main' && secrets.OPENSHIFT_PROD_PORTAL_TOKEN || (github.ref == 'refs/heads/dev' && secrets.OPENSHIFT_DEV_PORTAL_TOKEN) || secrets.OPENSHIFT_TEST_PORTAL_TOKEN }}
          insecure_skip_tls_verify: true

      - name: Deploy with Helm
        run: |
          helm upgrade --install kiln ./helm --set image.tag=${{ needs.build_and_push_portal.outputs.image_tag }}

      - name: Trigger OpenShift Rollout
        run: |
         oc rollout restart deployment/kiln  