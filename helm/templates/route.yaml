{{- range .Values.routes }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .name }}
  annotations:
    haproxy.router.openshift.io/ip_whitelist: {{ join " " .whitelist }}
  labels:
    app.kubernetes.io/name: kiln
spec:
  to:
    kind: Service
    name: kiln
  port:
    targetPort: 8080
  tls:
    termination: edge
{{- end }}