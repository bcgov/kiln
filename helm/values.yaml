replicaCount: 1

image:
  repository: ghcr.io/bcgov/kiln
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"       
  limits:
    memory: "512Mi"
    cpu: "250m"     

nodeSelector: {}

tolerations: []

affinity: {}

routes:
  - name: kiln
    whitelist:
      - 142.22.0.0/15
      - 142.24.0.0/13
      - 142.32.0.0/14
      - 142.36.0.0/16
  - name: kiln-outbound-api
    whitelist:
      - 142.34.110.70